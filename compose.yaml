services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: local-root-password
      MYSQL_DATABASE: ergasia_1
      MYSQL_USER: app
      MYSQL_PASSWORD: local-app-password
    volumes:
      - db_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uapp -plocal-app-password --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
  app:
    build: .
    environment:
      DB_HOST: db
      DB_NAME: ergasia_1
      DB_USER: app
      DB_PASSWORD: local-app-password
    stdin_open: true
    tty: true
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
